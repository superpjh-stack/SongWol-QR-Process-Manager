[project]
name = "songwol-qr-backend"
version = "0.0.1"
description = "송월타월 QR 공정관리시스템 API 서버"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "jinja2>=3.1",
    "segno>=1.6",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",
    "pillow>=10.0",  # 도안 썸네일 (A2-02, png/jpg 만)
    # 작업지시서 PDF (plan §3, S1-5). 시스템 라이브러리 필요: macOS `brew install pango cairo gdk-pixbuf libffi`,
    # Debian `apt-get install libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 fonts-nanum`
    "weasyprint>=62",
    # 지연 감지 배치 (api-contract §6.5, S4) — 프로세스 내 10분 잡. 별도 워커/브로커 없음(plan §5.1).
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pypdfium2>=4.30",  # test_pdf: 쪽 수·본문 텍스트 확인
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# autogenerate 산출물 형식 유지 (CHECK 목록 등 긴 문자열)
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^alembic/"]

[[tool.mypy.overrides]]
module = [
    "segno", "segno.*", "jose", "jose.*", "passlib", "passlib.*", "openpyxl", "openpyxl.*",
    "weasyprint", "weasyprint.*", "apscheduler", "apscheduler.*",
]
ignore_missing_imports = true

[tool.setuptools.package-data]
app = ["domain/label/templates/*.j2"]
