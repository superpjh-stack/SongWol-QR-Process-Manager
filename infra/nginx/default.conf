# TLS(Let's Encrypt) 발급 순서:
#   1. 이 파일 그대로(80번 포트만) 기동
#   2. docker compose -f infra/docker-compose.prod.yml run --rm certbot certonly \
#        --webroot -w /var/www/certbot -d ${DOMAIN} -m ${ADMIN_EMAIL} --agree-tos
#   3. 아래 두 곳의 `server_name _;` 를 실제 도메인으로 바꾸고, 파일 맨 아래 443 서버 블록 주석 해제
#   4. docker compose -f infra/docker-compose.prod.yml restart nginx
#   certbot 컨테이너가 12시간마다 자동 갱신을 시도한다(infra/docker-compose.prod.yml).
upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20m;   # 도안 파일 업로드

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://backend;
    }

    # 나머지: web 정적 (SPA fallback)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Service Worker 는 캐시하지 않는다
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}

