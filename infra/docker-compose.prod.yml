# 운영 배포 (plan §5.4): nginx(TLS) · backend(uvicorn 2 workers) · postgres(볼륨) · backup/파티션 cron.
# 실행 전 준비물(현장/사용자 몫, 코드로 대신할 수 없음):
#   1. 실 서버(VM) + 도메인 + 80/443 포트 개방
#   2. 저장소 루트에 .env (.env.example 참고 — DATABASE_URL·JWT_SECRET·CHECKCODE_SECRET·PRINTER_*·DOMAIN)
#   3. 최초 발급: `docker compose -f infra/docker-compose.prod.yml run --rm certbot certonly --webroot -w /var/www/certbot -d ${DOMAIN}`
#      발급 후 infra/nginx/default.conf 의 TLS 블록 주석 해제하고 nginx 재시작
# 기동: `docker compose -f infra/docker-compose.prod.yml up -d --build` (저장소 루트에서 실행)
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_DB: songwol_qr
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d songwol_qr"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      TZ: Asia/Seoul
    volumes:
      - artwork:/data/artwork     # 도안 파일
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  # 일 1회 DB 백업 + 도안 rsync(02:00 KST), 월 1회 파티션 선생성(매월 1일 03:00 KST).
  # backend 와 같은 이미지 재사용(cron·postgresql-client·rsync 는 backend/Dockerfile 에 포함).
  cron:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      TZ: Asia/Seoul
      DB_HOST: postgres
      DB_USER: postgres
      ARTWORK_DIR: /data/artwork
    volumes:
      - artwork:/data/artwork:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - "chmod +x /app/infra/scripts/backup.sh && crontab /app/infra/scripts/crontab && cron -f"

  web-build:
    build:
      context: ..
      dockerfile: web/Dockerfile
    volumes:
      - webdist:/out

  # 최초 인증서 발급·자동 갱신용(webroot 방식). 도메인·이메일 확정 후 위 주석의 certonly 커맨드를 1회 수동 실행한다.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: ["sh", "-c"]
    command:
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - webdist:/usr/share/nginx/html:ro   # web/dist 빌드 산출물
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_started
      web-build:
        condition: service_completed_successfully

volumes:
  pgdata:
  backups:
  artwork:
  webdist:
  letsencrypt:
  certbot-webroot:
